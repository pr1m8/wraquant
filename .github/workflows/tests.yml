name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PDM
        run: pip install pdm
      - name: Install dependencies
        run: pdm install -G dev -G accelerate -G ml -G viz
      - name: Run tests
        run: pdm run pytest tests/ -q --tb=short
      - name: Run MCP tests
        env:
          PYTHONPATH: mcp/src:src
        run: pdm run pytest mcp/tests/ -q --tb=short
