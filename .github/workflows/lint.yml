name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PDM
        run: pip install pdm
      - name: Install dependencies
        run: pdm install -G dev
      - name: Run Ruff
        run: pdm run ruff check src/ mcp/src/
